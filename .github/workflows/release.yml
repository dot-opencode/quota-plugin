name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag version ($tag_version) != package.json version ($pkg_version)" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: web/cpa-quota.user.js
          generate_release_notes: true
      - name: Move release branch to the tagged commit
        run: git push origin "+$GITHUB_SHA:refs/heads/release"
